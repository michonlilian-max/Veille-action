name: Mise à jour de la veille

on:
  schedule:
    # Un seul run par nuit, à 03h00 UTC (~4h/5h du matin en France selon
    # l'heure d'été/hiver — nuit toute l'année), largement après la clôture
    # des marchés US (16h00 ET = 20h00/21h00 UTC selon la saison).
    # Lundi à samedi UTC pour capturer la clôture de chaque jour de bourse
    # (lundi à vendredi) : le run du lundi 03h UTC reflète la clôture de
    # vendredi, celui du mardi reflète celle de lundi, etc. Le samedi
    # (clôture de vendredi) est redondant pour le score mais garde le
    # dashboard à jour le week-end. Sans le lundi, la séance de lundi
    # n'aurait jamais de score "du matin" à comparer au réel — cf.
    # backtest.yml, qui a justement besoin de ce point de comparaison
    # chaque jour de bourse.
    - cron: "0 3 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la collecte, le calcul des scores et l'envoi de l'email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python scripts/run_all.py

      - name: Committer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour automatique de la veille [skip ci]"
          # Ce run peut prendre plusieurs heures (S&P 500) : la branche a pu
          # bouger entre-temps (un autre workflow, ou un push manuel) et un
          # simple "git push" serait rejeté (non-fast-forward) — vécu en
          # pratique sur le run de test S&P 500 (échec après ~3h19 de calcul
          # valide, données perdues faute de retry). On rebase et on
          # réessaie plutôt que d'abandonner tout le travail de collecte.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Échec du push après 5 tentatives."
              exit 1
            fi
            echo "Push rejeté (tentative $n/5) — rebase sur le dernier commit distant..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

      - name: Préparer le dossier à publier sur Pages
        run: |
          mkdir -p _site/data
          cp -r dashboard/. _site/
          cp data/output.json _site/data/output.json
          if [ -f data/backtest_summary.json ]; then cp data/backtest_summary.json _site/data/backtest_summary.json; fi
          if [ -f data/paper_trades_summary.json ]; then cp data/paper_trades_summary.json _site/data/paper_trades_summary.json; fi
          if [ -f data/midcap_candidates.json ]; then cp data/midcap_candidates.json _site/data/midcap_candidates.json; fi

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
