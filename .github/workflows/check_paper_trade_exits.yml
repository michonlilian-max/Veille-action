name: Bot de trading — vérification des sorties (paper trading uniquement)

on:
  schedule:
    # Plusieurs vérifications par jour de bourse pendant les heures de
    # marché US, pour réagir aux seuils de take-profit/stop-loss dans la
    # journée plutôt qu'une seule fois. Ces 5 horaires (35 min après
    # chaque heure, 15h-19h UTC) tombent tous dans les heures de marché US
    # aussi bien en heure d'été (9h30-16h00 ET = 13h30-20h00 UTC) qu'en
    # heure d'hiver (9h30-16h00 ET = 14h30-21h00 UTC) — c'est
    # l'intersection des deux fenêtres. Le dernier passage (19h35 UTC)
    # envoie en plus l'email récapitulatif du jour (cf. le step
    # "Déterminer..." ci-dessous) ; il n'est pas exactement à la clôture
    # (marge DST oblige) mais reste dans les dernières heures de la séance.
    - cron: "35 15,16,17,18,19 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check_exits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Déterminer si c'est le dernier passage du jour
        id: last_check
        run: |
          hour=$(date -u +%H)
          if [ "$hour" -ge 19 ]; then
            echo "send_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "send_report=false" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ Mêmes clés PAPER TRADING que le workflow d'ouverture — jamais
      # de clé de trading réel ici. scripts/check_paper_trade_exits.py
      # force paper=True en dur de toute façon (via scripts/paper_trade.py).
      - name: Vérifier les seuils de sortie (et envoyer le récap si dernier passage du jour)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_DAILY_REPORT: ${{ steps.last_check.outputs.send_report }}
        run: python scripts/check_paper_trade_exits.py

      - name: Committer le journal de paper trading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trades/ 2>/dev/null || true
          if [ -f data/paper_trades_summary.json ]; then git add data/paper_trades_summary.json; fi
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Vérification des sorties du bot de paper trading [skip ci]"
          # cf. veille.yml : la branche peut avoir bougé pendant ce run
          # (autre workflow, push manuel) — on rebase et on réessaie plutôt
          # que de perdre le journal du jour sur un simple rejet.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Échec du push après 5 tentatives."
              exit 1
            fi
            echo "Push rejeté (tentative $n/5) — rebase sur le dernier commit distant..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

      - name: Préparer le dossier à publier sur Pages
        run: |
          mkdir -p _site/data
          cp -r dashboard/. _site/
          cp data/output.json _site/data/output.json
          if [ -f data/backtest_summary.json ]; then cp data/backtest_summary.json _site/data/backtest_summary.json; fi
          if [ -f data/paper_trades_summary.json ]; then cp data/paper_trades_summary.json _site/data/paper_trades_summary.json; fi

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check_exits
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
