name: Candidats S&P MidCap 400 à l'inclusion S&P 500

on:
  schedule:
    # Même horaire que veille.yml (lundi-samedi 03h00 UTC) — sur demande
    # explicite, pour tourner chaque nuit comme le run principal plutôt
    # qu'une fois par semaine.
    # ⚠️ Coût réel de ce choix : ~900 appels yfinance individuels (pas le
    # téléchargement groupé) CHAQUE NUIT au lieu d'une fois par semaine,
    # soit x7 le volume hebdomadaire sur une API non officielle qui peut
    # déjà casser sans préavis (même limite que collect_price.py). À
    # surveiller si ce module se met à échouer plus souvent qu'avant — le
    # premier réflexe sera de revenir à un rythme hebdomadaire.
    # Les deux workflows peuvent tourner en même temps sans se bloquer
    # (cf. le fix de concurrency appliqué aux 5 workflows).
    - cron: "0 3 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  midcap_candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer les candidats MidCap 400 et envoyer l'email récapitulatif
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/midcap_candidates.py

      - name: Committer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/midcap_candidates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour hebdomadaire des candidats MidCap 400 [skip ci]"
          # cf. veille.yml : la branche peut avoir bougé pendant ce run
          # (autre workflow, push manuel) — on rebase et on réessaie plutôt
          # que de perdre le résultat sur un simple rejet.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Échec du push après 5 tentatives."
              exit 1
            fi
            echo "Push rejeté (tentative $n/5) — rebase sur le dernier commit distant..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

      - name: Préparer le dossier à publier sur Pages
        run: |
          mkdir -p _site/data
          cp -r dashboard/. _site/
          cp data/output.json _site/data/output.json
          if [ -f data/backtest_summary.json ]; then cp data/backtest_summary.json _site/data/backtest_summary.json; fi
          if [ -f data/paper_trades_summary.json ]; then cp data/paper_trades_summary.json _site/data/paper_trades_summary.json; fi
          if [ -f data/midcap_candidates.json ]; then cp data/midcap_candidates.json _site/data/midcap_candidates.json; fi

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    needs: midcap_candidates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
