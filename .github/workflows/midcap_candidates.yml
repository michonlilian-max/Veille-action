name: Candidats S&P MidCap 400 à l'inclusion S&P 500

on:
  schedule:
    # Une fois par semaine (dimanche 08h00 UTC) — l'éligibilité à
    # l'inclusion au S&P 500 ne change pas d'un jour à l'autre, et le run
    # est lourd (~900 appels individuels yfinance pour la capitalisation
    # + BPA, plusieurs minutes) : pas la peine de le faire tourner chaque
    # nuit comme veille.yml. Horaire choisi pour ne pas chevaucher les
    # autres crons (veille.yml lun-sam 03h UTC, backtest.yml et le bot de
    # trading en semaine seulement).
    - cron: "0 8 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  midcap_candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Calculer les candidats MidCap 400 et envoyer l'email récapitulatif
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/midcap_candidates.py

      - name: Committer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/midcap_candidates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour hebdomadaire des candidats MidCap 400 [skip ci]"
          # cf. veille.yml : la branche peut avoir bougé pendant ce run
          # (autre workflow, push manuel) — on rebase et on réessaie plutôt
          # que de perdre le résultat sur un simple rejet.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Échec du push après 5 tentatives."
              exit 1
            fi
            echo "Push rejeté (tentative $n/5) — rebase sur le dernier commit distant..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

      - name: Préparer le dossier à publier sur Pages
        run: |
          mkdir -p _site/data
          cp -r dashboard/. _site/
          cp data/output.json _site/data/output.json
          if [ -f data/backtest_summary.json ]; then cp data/backtest_summary.json _site/data/backtest_summary.json; fi
          if [ -f data/paper_trades_summary.json ]; then cp data/paper_trades_summary.json _site/data/paper_trades_summary.json; fi
          if [ -f data/midcap_candidates.json ]; then cp data/midcap_candidates.json _site/data/midcap_candidates.json; fi

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    needs: midcap_candidates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
