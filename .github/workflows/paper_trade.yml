name: Bot de trading (paper trading uniquement)

on:
  schedule:
    # Après l'ouverture des marchés US (9h30 ET), du lundi au vendredi.
    # 14h35 UTC reste après l'ouverture aussi bien en heure d'été US
    # (9h30 ET = 13h30 UTC) qu'en heure d'hiver (9h30 ET = 14h30 UTC).
    - cron: "35 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  paper_trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # ⚠️ ALPACA_API_KEY / ALPACA_SECRET_KEY doivent être des clés PAPER
      # TRADING (générées sur https://app.alpaca.markets en mode Paper).
      # scripts/paper_trade.py force paper=True en dur de toute façon,
      # mais utilise bien des clés paper ici par principe — jamais de clé
      # de trading réel dans ce workflow.
      - name: Rebalancer le portefeuille paper (si ALPACA_API_KEY configuré)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/paper_trade.py

      - name: Committer le journal de paper trading
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trades/ 2>/dev/null || true
          if [ -f data/paper_trades_summary.json ]; then git add data/paper_trades_summary.json; fi
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Journal de paper trading quotidien [skip ci]"
          # cf. veille.yml : la branche peut avoir bougé pendant ce run
          # (autre workflow, push manuel) — on rebase et on réessaie plutôt
          # que de perdre le journal du jour sur un simple rejet.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "Échec du push après 5 tentatives."
              exit 1
            fi
            echo "Push rejeté (tentative $n/5) — rebase sur le dernier commit distant..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

      - name: Préparer le dossier à publier sur Pages
        run: |
          mkdir -p _site/data
          cp -r dashboard/. _site/
          cp data/output.json _site/data/output.json
          if [ -f data/backtest_summary.json ]; then cp data/backtest_summary.json _site/data/backtest_summary.json; fi
          if [ -f data/paper_trades_summary.json ]; then cp data/paper_trades_summary.json _site/data/paper_trades_summary.json; fi

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: paper_trade
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
